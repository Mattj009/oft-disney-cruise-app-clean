<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="assets/icon.jpg"><link rel="apple-touch-icon" href="assets/icon.jpg"><link rel="manifest" href="manifest.webmanifest"><title>Daily Disney — Cruise Lineup</title>
<style>:root{--navy:#0B1F3A;--red:#D72638;--gold:#F4C542}*{box-sizing:border-box}html,body{margin:0;background:#07182d}body{padding-bottom:84px;font-family:Arial,sans-serif}.wrap{position:relative;max-width:760px;margin:auto;line-height:0}.poster{display:block;width:100%;height:auto}.day{position:absolute;left:4.5%;width:91%;display:block;border-radius:24px}.day:focus{outline:4px solid var(--gold);outline-offset:-5px}.pre{top:17.3%;height:16.5%}.d1{top:34.8%;height:15.6%}.d2{top:51.4%;height:14.6%}.d3{top:67.0%;height:14.0%}.d4{top:82.0%;height:14.2%}.fixedbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(247,245,240,.96);border-top:1px solid #ddd3c6}.fixedinner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.fixedbtn{min-height:56px;border-radius:16px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:.95rem}.daily{background:var(--red);color:white;border:2px solid #b51d2b}.camera{background:var(--navy);color:white;border:2px solid #19365f;cursor:pointer}.camera-input{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%)}body{padding-bottom:92px!important;}
</style>

<style id="oft-three-button-style">
.oft-bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:9990;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(247,245,240,.96);border-top:1px solid #ddd3c6;backdrop-filter:blur(10px)}
.oft-bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:8px}
.oft-bottom-btn{min-height:56px;border-radius:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px;font-family:Arial,sans-serif;font-weight:900;font-size:.88rem;line-height:1;text-align:center;box-sizing:border-box}
.oft-bottom-daily{background:#D72638;color:white;border:2px solid #b51d2b}
.oft-bottom-home{background:#F4C542;color:#0B1F3A;border:2px solid #d7aa22;font-size:1.45rem}
.oft-bottom-camera{background:#0B1F3A;color:white;border:2px solid #19365f;cursor:pointer}
.oft-camera-input{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap}
</style>

</head><body><main class="wrap"><img class="poster" src="assets/lineup.jpg" alt="The Cruise Lineup">

<a class="day d2" href="https://mattj009.github.io/oft-disney-cruise-app-clean/day2/index.html" aria-label="Day 2"></a><a class="day d3" href="https://mattj009.github.io/oft-disney-cruise-app-clean/day3/index.html" aria-label="Day 3"></a><a class="day d4" href="https://mattj009.github.io/oft-disney-cruise-app-clean/day4/index.html" aria-label="Day 4"></a>
</main>
<nav class="oft-bottom-bar" aria-label="OFT navigation">
  <div class="oft-bottom-inner">
    <a class="oft-bottom-btn oft-bottom-daily" href="https://mattj009.github.io/oft-disney-cruise-app-clean/lineup.html"><span>✨</span>DAILY DISNEY</a>
    <a class="oft-bottom-btn oft-bottom-home" href="https://mattj009.github.io/oft-disney-cruise-app-clean/index.html" aria-label="Home" title="Home">🏠</a>
    <label class="oft-bottom-btn oft-bottom-camera" for="oft-camera"><span>📷</span>SMILE, PAL!</label>
    <input id="oft-camera" class="oft-camera-input" type="file" accept="image/*" capture="environment">
  </div>
</nav>

</body></html>
